name: Build and Push Docker Image to Prod

on:
  push:
    branches:
      - prod

env:
  PROJECT_ID: spry-bricolage-298920
  REGION: us
  IMAGE_NAME: us-docker.pkg.dev/spry-bricolage-298920/gcr.io/prod/buildly-core

jobs:
  build:
    name: Build and Push image to GCR
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # auto generate tag from label defined in Dockerfile
    - uses: butlerlogic/action-autotag@1.1.2
      id: tag_version
      env:
        GITHUB_TOKEN: "${{ secrets.RELEASE_TOKEN }}"
      with:
        strategy: docker
        tag_prefix: "v"

    # Create release notes
    - name: Build changelog
      id: build_changelog
      uses: mikepenz/release-changelog-builder-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    # Create release
    - name: Create Release
      id: create_release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      with:
        tag_name: ${{ steps.tag_version.outputs.tagname }}
        release_name: Release ${{ steps.tag_version.outputs.tagname }}
        body: ${{ steps.build_changelog.outputs.changelog }}
        draft: false
        prerelease: false

    - id: "auth"
      uses: "google-github-actions/auth@v1"
      with:
        credentials_json: "${{ secrets.GCR_JSON_KEY }}"

    - name: "Set up Cloud SDK"
      uses: "google-github-actions/setup-gcloud@v1"

    - name: "Use gcloud CLI"
      run: "gcloud info"

    - name: "Docker auth"
      run: |-
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build docker image
      run: docker build -t $IMAGE_NAME:build-${{ github.run_number }} .
  
    - name: Push to Google Artifact Registry
      run: docker push $IMAGE_NAME:build-${{ github.run_number }}

    - name: Update Kubernetes manifest in ops repo
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        TARGET_REPO: "TransparentPath/ops"
        TARGET_FILE: "kapstan/Production/buildy-core/templates/manifest.yaml"
        TARGET_BRANCH: "master"
        IMAGE_TAG: "build-${{ github.run_number }}"
      run: |
        echo "🚀 Updating Production manifest to use $IMAGE_NAME:$IMAGE_TAG"

        # Clone the ops repository
        git clone https://x-access-token:$GITHUB_TOKEN@github.com/$TARGET_REPO.git ops-repo
        cd ops-repo
        git checkout $TARGET_BRANCH

        # Update only the main buildy-core container image
        # This sed command finds the line with buildy-core image and updates only that occurrence
        sed -i.bak "s|image: us-docker.pkg.dev/spry-bricolage-298920/gcr.io/prod/buildy-core:.*|image: $IMAGE_NAME:$IMAGE_TAG|" $TARGET_FILE

        # Verify the change was made
        if grep -q "$IMAGE_NAME:$IMAGE_TAG" $TARGET_FILE; then
          echo "✅ Image tag updated successfully in manifest"
        else
          echo "❌ Failed to update image tag in manifest"
          exit 1
        fi

        # Configure git
        git config user.name "Buildly Core CI"
        git config user.email "ci-bot@transparentpath.com"

        # Commit and push changes
        git add $TARGET_FILE
        if git diff --staged --quiet; then
          echo "ℹ️  No changes to commit - manifest already up to date"
        else
          git commit -m "🚀 Deploy buildy-core:$IMAGE_TAG to Production

        Automated deployment from buildly_core repository
        Source commit: ${{ github.sha }}
        Triggered by: ${{ github.actor }}
        Build number: ${{ github.run_number }}
        Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push origin $TARGET_BRANCH
          echo "✅ Manifest updated and pushed successfully"
          echo "🔄 Kubernetes pods will auto-refresh with new image"
        fi

    # Send email alert
    - name: Email Alert
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: Github Actions Build and Push job alert
        to: ${{ secrets.RECIPIENT_EMAIL }}
        from: ${{ secrets.SENDER_EMAIL }}
        body: Production Docker Image of buildly core pushed to Google Container Registry Successfully
