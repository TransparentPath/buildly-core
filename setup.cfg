[tool:pytest]
norecursedirs=build bin dist docs .git static templates
# --cov must be given a value: bare `--cov` takes an optional argument and
# swallows the first positional arg, so `pytest core/tests/test_x.py` silently ran
# the whole suite instead of the named file.
addopts=-v --cov=.


[flake8]
exclude = settings,manage.py,wsgi.py,migrations,models.py,tests
max-line-length = 120
